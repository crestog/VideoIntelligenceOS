<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="VIOS Admin Panel — Storage, Categories, Cleanup & System Health">
<title>VIOS Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#030303;--surface:#111111;--surface-hover:#1c1c1c;--accent:#00e5ff;--text:#fff;--text-dim:#999;--radius:18px;--red:#ef4444;--green:#10b981;--yellow:#f59e0b}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px;line-height:1.5}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.section{background:var(--surface);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);padding:28px 32px;margin-bottom:24px;backdrop-filter:blur(16px);box-shadow:0 8px 32px rgba(0,0,0,.45);animation:fadeIn .5s ease both}
.section:nth-child(2){animation-delay:.08s}.section:nth-child(3){animation-delay:.16s}.section:nth-child(4){animation-delay:.24s}
.section-title{font-size:1.15rem;font-weight:700;margin-bottom:20px;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
.section-title span{color:var(--accent)}

/* ── Progress Bar ── */
.progress-wrap{background:#1a1a1a;border-radius:12px;height:24px;overflow:hidden;position:relative;margin-bottom:10px}
.progress-bar{height:100%;border-radius:12px;transition:width .8s cubic-bezier(.4,0,.2,1),background .5s}
.progress-bar.green{background:linear-gradient(90deg,#059669,var(--green))}
.progress-bar.yellow{background:linear-gradient(90deg,#d97706,var(--yellow))}
.progress-bar.red{background:linear-gradient(90deg,#dc2626,var(--red))}
.progress-label{font-size:.85rem;color:var(--text-dim);margin-bottom:14px}

/* ── Stat Cards ── */
.stat-row{display:flex;gap:14px;flex-wrap:wrap}
.stat-card{flex:1;min-width:140px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:16px 18px;transition:transform .2s,border-color .3s}
.stat-card:hover{transform:translateY(-2px);border-color:rgba(0,229,255,.25)}
.stat-card .label{font-size:.78rem;color:var(--text-dim);margin-bottom:4px}
.stat-card .value{font-size:1.15rem;font-weight:600}

/* ── Two-column layout ── */
.cols{display:flex;gap:24px}
@media(max-width:760px){.cols{flex-direction:column}}
.col{flex:1;min-width:0}
.col-title{font-size:.9rem;font-weight:600;color:var(--text-dim);margin-bottom:12px}

/* ── Category Items ── */
.cat-item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px 14px;margin-bottom:8px;cursor:grab;transition:background .2s,box-shadow .25s,opacity .2s}
.cat-item:hover{background:var(--surface-hover);box-shadow:0 0 0 1px rgba(0,229,255,.15)}
.cat-item.drag-over{border-color:var(--accent);box-shadow:0 0 12px rgba(0,229,255,.18)}
.grip{color:var(--text-dim);font-size:1.1rem;user-select:none;cursor:grab}
.rank{background:rgba(0,229,255,.12);color:var(--accent);font-size:.72rem;font-weight:700;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.cat-name{flex:1;font-weight:500;font-size:.9rem}
.badge{font-size:.72rem;background:rgba(255,255,255,.08);padding:3px 8px;border-radius:8px;color:var(--text-dim)}
.remove-btn{background:none;border:none;color:var(--red);font-size:1.1rem;cursor:pointer;opacity:.6;transition:opacity .2s}
.remove-btn:hover{opacity:1}
.empty-state{text-align:center;color:var(--text-dim);padding:32px 0;font-size:.88rem}

/* ── Available list ── */
.avail-item{display:flex;align-items:center;gap:10px;padding:9px 14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;margin-bottom:8px;transition:background .2s}
.avail-item:hover{background:var(--surface-hover)}
.avail-item input[type="checkbox"]{accent-color:var(--accent);width:16px;height:16px}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:12px;font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;border:none;transition:transform .15s,box-shadow .25s,background .2s}
.btn:active{transform:scale(.97)}
.btn-accent{background:var(--accent);color:#000}.btn-accent:hover{box-shadow:0 0 20px rgba(0,229,255,.3)}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{box-shadow:0 0 20px rgba(239,68,68,.3)}
.btn-red:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn-outline{background:transparent;border:1.5px solid rgba(255,255,255,.15);color:var(--text)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-yellow-outline{background:transparent;border:1.5px solid var(--yellow);color:var(--yellow)}.btn-yellow-outline:hover{box-shadow:0 0 16px rgba(245,158,11,.2)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{box-shadow:0 0 20px rgba(16,185,129,.3)}
.btn-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

/* ── Cleanup section ── */
.cleanup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:16px}
.cleanup-item{display:flex;align-items:center;gap:8px;font-size:.88rem}
.cleanup-item input{accent-color:var(--accent);width:15px;height:15px}
.toggle-row{display:flex;gap:20px;margin-bottom:16px;flex-wrap:wrap}
.toggle-row label{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--text-dim);cursor:pointer}
.preview-box{background:#0a0a0a;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px 20px;margin-top:14px;font-size:.88rem;color:var(--accent);display:none}

/* ── System pills ── */
.pill-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pill{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 18px;text-align:center;min-width:110px;transition:border-color .3s}
.pill:hover{border-color:rgba(0,229,255,.2)}
.pill .pill-val{font-size:1.4rem;font-weight:700;color:var(--accent)}
.pill .pill-label{font-size:.72rem;color:var(--text-dim);margin-top:2px}

/* ── Log box ── */
.log-box{background:#080808;border:1px solid rgba(255,255,255,.06);border-radius:14px;height:300px;overflow-y:auto;padding:14px 16px;font-family:'JetBrains Mono','Courier New',monospace;font-size:.78rem;line-height:1.7}
.log-box::-webkit-scrollbar{width:6px}.log-box::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
.log-line .ts{color:var(--text-dim)}.log-line .sub{color:var(--accent);font-weight:600}
.log-line.SUCCESS .msg{color:var(--green)}.log-line.WARN .msg{color:var(--yellow)}.log-line.ERROR .msg{color:var(--red)}.log-line.INFO .msg{color:var(--text)}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal-card{background:var(--surface);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);padding:32px;max-width:440px;width:90%;box-shadow:0 24px 64px rgba(0,0,0,.6);transform:scale(.92);transition:transform .25s}
.modal-overlay.active .modal-card{transform:scale(1)}
.modal-card h3{font-size:1.05rem;margin-bottom:12px}.modal-card p{font-size:.88rem;color:var(--text-dim);margin-bottom:22px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}

/* ── Toast ── */
#toast-container{position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:12px;font-size:.84rem;font-weight:500;animation:fadeIn .3s ease;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast-success{background:var(--green);color:#fff}.toast-error{background:var(--red);color:#fff}
.toast-info{background:var(--accent);color:#000}.toast-warn{background:var(--yellow);color:#000}
</style>
</head>
<body>
<div id="toast-container"></div>

<!-- ═══════ 1. DISK DASHBOARD ═══════ -->
<div class="section" id="disk-section">
  <div class="section-title">💾 <span>STORAGE</span></div>
  <div class="progress-wrap"><div class="progress-bar green" id="disk-bar" style="width:0%"></div></div>
  <div class="progress-label" id="disk-label">Loading…</div>
  <div class="stat-row">
    <div class="stat-card"><div class="label">📁 Videos</div><div class="value" id="stat-videos">—</div></div>
    <div class="stat-card"><div class="label">🎞️ Frames</div><div class="value" id="stat-frames">—</div></div>
    <div class="stat-card"><div class="label">🖼️ Thumbnails</div><div class="value" id="stat-thumbs">—</div></div>
    <div class="stat-card"><div class="label">🟢 Free</div><div class="value" id="stat-free">—</div></div>
  </div>
</div>

<!-- ═══════ 2. CATEGORY CONTROL ═══════ -->
<div class="section" id="category-section">
  <div class="section-title">📂 <span>CATEGORY CONTROL</span></div>
  <div class="cols">
    <div class="col">
      <div class="col-title">Active Categories <span style="color:var(--text-dim);font-weight:400">(drag to reorder)</span></div>
      <div id="active-list"></div>
    </div>
    <div class="col">
      <div class="col-title">Available Categories</div>
      <div id="available-list"></div>
      <div class="btn-row"><button class="btn btn-accent" onclick="activateSelected()">✚ Activate Selected</button></div>
    </div>
  </div>
</div>

<!-- ═══════ 3. STORAGE CLEANUP ═══════ -->
<div class="section" id="cleanup-section">
  <div class="section-title">🧹 <span>STORAGE CLEANUP</span></div>
  <div class="cleanup-grid" id="cleanup-list"></div>
  <div class="toggle-row">
    <label><input type="checkbox" id="del-frames" checked> Delete extracted frames</label>
    <label><input type="checkbox" id="del-videos"> Delete source video files</label>
  </div>
  <div class="btn-row">
    <button class="btn btn-outline" onclick="previewCleanup()">Preview</button>
    <button class="btn btn-red" id="exec-cleanup-btn" disabled onclick="confirmCleanup()">🗑️ Execute Cleanup</button>
  </div>
  <div class="preview-box" id="preview-box"></div>
</div>

<!-- ═══════ 4. SYSTEM MONITOR ═══════ -->
<div class="section" id="system-section">
  <div class="section-title">📊 <span>SYSTEM HEALTH</span></div>
  <div class="pill-row">
    <div class="pill"><div class="pill-val" id="q-pending">0</div><div class="pill-label">PENDING</div></div>
    <div class="pill"><div class="pill-val" id="q-processing">0</div><div class="pill-label">PROCESSING</div></div>
    <div class="pill"><div class="pill-val" id="q-completed">0</div><div class="pill-label">COMPLETED</div></div>
    <div class="pill"><div class="pill-val" id="q-failed">0</div><div class="pill-label">FAILED</div></div>
  </div>
  <div class="btn-row" style="margin-bottom:18px">
    <button class="btn btn-yellow-outline" id="pause-btn" onclick="toggleEngine()">⏸ Pause CV Engine</button>
  </div>
  <div class="col-title">Live Logs</div>
  <div class="log-box" id="admin-logs"></div>
</div>

<!-- ═══════ CONFIRM MODAL ═══════ -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal-card">
    <h3>⚠️ Confirm Deletion</h3>
    <p id="modal-msg">Are you sure? This action cannot be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" onclick="executeCleanup()">Delete</button>
    </div>
  </div>
</div>

<script>
/* ── Helpers ── */
const $=id=>document.getElementById(id);
const API='';
let enginePaused=false, previewData=null;

function showToast(msg,type='info'){
  const t=document.createElement('div');
  t.className=`toast toast-${type}`;t.textContent=msg;
  $('toast-container').appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

async function api(path,opts={}){
  try{const r=await fetch(API+path,opts);if(!r.ok)throw new Error(r.statusText);return r.json();}
  catch(e){showToast(`API error: ${e.message}`,'error');return null;}
}

function gb(bytes){return(bytes/1073741824).toFixed(1)+' GB';}
function mb(bytes){return(bytes/1048576).toFixed(1)+' MB';}

/* ── 1. Disk Dashboard ── */
async function loadDisk(){
  const d=await api('/api/admin/disk');if(!d)return;
  const pct=((d.used/d.total)*100).toFixed(1);
  const bar=$('disk-bar');
  bar.style.width=pct+'%';
  bar.className='progress-bar '+(pct<60?'green':pct<80?'yellow':'red');
  $('disk-label').textContent=`${gb(d.used)} / ${gb(d.total)} Used (${pct}%)`;
  $('stat-videos').textContent=gb(d.videos||0);
  $('stat-frames').textContent=gb(d.frames||0);
  $('stat-thumbs').textContent=gb(d.thumbnails||0);
  $('stat-free').textContent=gb(d.free||0);
}

/* ── 2. Category Control ── */
let allCategories=[];
async function loadCategories(){
  const d=await api('/api/admin/categories');if(!d)return;
  allCategories=d;
  renderActive(d.filter(c=>c.active));
  renderAvailable(d.filter(c=>!c.active));
}

function renderActive(list){
  const el=$('active-list');
  if(!list.length){el.innerHTML='<div class="empty-state">No active categories — select from available</div>';return;}
  el.innerHTML='';
  list.forEach((c,i)=>{
    const div=document.createElement('div');div.className='cat-item';div.draggable=true;div.dataset.name=c.name;
    div.innerHTML=`<span class="grip">≡</span><span class="rank">${i+1}</span><span class="cat-name">${c.name}</span><span class="badge">${c.video_count||0} vids</span><span class="badge">${mb(c.disk_usage||0)}</span><button class="remove-btn" onclick="deactivate('${c.name}')" title="Remove">×</button>`;
    div.addEventListener('dragstart',handleDragStart);
    div.addEventListener('dragover',handleDragOver);
    div.addEventListener('dragenter',handleDragEnter);
    div.addEventListener('dragleave',handleDragLeave);
    div.addEventListener('drop',handleDrop);
    div.addEventListener('dragend',handleDragEnd);
    el.appendChild(div);
  });
}
function renderAvailable(list){
  const el=$('available-list');el.innerHTML='';
  if(!list.length){el.innerHTML='<div class="empty-state">All categories are active</div>';return;}
  list.forEach(c=>{
    const div=document.createElement('div');div.className='avail-item';
    div.innerHTML=`<input type="checkbox" value="${c.name}"><span class="cat-name">${c.name}</span><span class="badge">${c.video_count||0} vids</span>`;
    el.appendChild(div);
  });
}

/* Drag & Drop */
let dragItem=null;
function handleDragStart(e){dragItem=this;this.style.opacity='0.4';e.dataTransfer.effectAllowed='move';}
function handleDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';}
function handleDragEnter(){if(this!==dragItem)this.classList.add('drag-over');}
function handleDragLeave(){this.classList.remove('drag-over');}
function handleDrop(e){
  e.preventDefault();this.classList.remove('drag-over');
  if(dragItem&&dragItem!==this){
    const list=this.parentNode,items=[...list.children];
    const from=items.indexOf(dragItem),to=items.indexOf(this);
    if(from<to)this.after(dragItem);else this.before(dragItem);
  }
  updateRanks();saveCategories();
}
function handleDragEnd(){this.style.opacity='1';document.querySelectorAll('.cat-item').forEach(i=>i.classList.remove('drag-over'));}

function updateRanks(){[...$('active-list').children].forEach((el,i)=>{const r=el.querySelector('.rank');if(r)r.textContent=i+1;});}

async function saveCategories(){
  const names=[...$('active-list').children].map(el=>el.dataset.name).filter(Boolean);
  await api('/api/admin/categories/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({categories:names})});
  showToast('Category order saved','success');
}

function deactivate(name){
  allCategories.forEach(c=>{if(c.name===name)c.active=false;});
  renderActive(allCategories.filter(c=>c.active));
  renderAvailable(allCategories.filter(c=>!c.active));
  saveCategories();
}

async function activateSelected(){
  const checked=[...$('available-list').querySelectorAll('input:checked')].map(i=>i.value);
  if(!checked.length){showToast('Select categories first','warn');return;}
  allCategories.forEach(c=>{if(checked.includes(c.name))c.active=true;});
  renderActive(allCategories.filter(c=>c.active));
  renderAvailable(allCategories.filter(c=>!c.active));
  saveCategories();
}

/* ── 3. Storage Cleanup ── */
function renderCleanupList(){
  const el=$('cleanup-list');el.innerHTML='';
  allCategories.filter(c=>c.active).forEach(c=>{
    const div=document.createElement('div');div.className='cleanup-item';
    div.innerHTML=`<input type="checkbox" value="${c.name}" checked><span>${c.name}</span><span class="badge">${c.frame_count||0} frames</span><span class="badge">${mb(c.disk_usage||0)}</span>`;
    el.appendChild(div);
  });
}

async function previewCleanup(){
  const cats=[...$('cleanup-list').querySelectorAll('input:checked')].map(i=>i.value);
  const body={categories:cats,delete_frames:$('del-frames').checked,delete_videos:$('del-videos').checked};
  const d=await api('/api/admin/storage/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!d)return;
  previewData={...body,...d};
  const box=$('preview-box');
  box.style.display='block';
  box.textContent=`Would free ${gb(d.bytes_to_free||0)} — ${d.video_count||0} videos, ${d.frame_folders||0} frame folders`;
  $('exec-cleanup-btn').disabled=false;
}

function confirmCleanup(){
  if(!previewData)return;
  $('modal-msg').textContent=`Are you sure? This will permanently delete ${gb(previewData.bytes_to_free||0)} of data.`;
  $('confirm-modal').classList.add('active');
}
function closeModal(){$('confirm-modal').classList.remove('active');}

async function executeCleanup(){
  closeModal();
  const d=await api('/api/admin/storage/cleanup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(previewData)});
  if(d){showToast('Cleanup completed successfully','success');previewData=null;$('exec-cleanup-btn').disabled=true;$('preview-box').style.display='none';loadDisk();loadCategories();}
}

/* ── 4. System Monitor ── */
async function loadSystem(){
  const d=await api('/api/admin/queue/status');if(!d)return;
  $('q-pending').textContent=d.pending??0;
  $('q-processing').textContent=d.processing??0;
  $('q-completed').textContent=d.completed??0;
  $('q-failed').textContent=d.failed??0;
  enginePaused=!!d.paused;
  const btn=$('pause-btn');
  if(enginePaused){btn.textContent='▶ Resume CV Engine';btn.className='btn btn-green';}
  else{btn.textContent='⏸ Pause CV Engine';btn.className='btn btn-yellow-outline';}
}

async function toggleEngine(){
  const endpoint=enginePaused?'/api/admin/queue/resume':'/api/admin/queue/pause';
  const d=await api(endpoint,{method:'POST'});
  if(d!==null){showToast(enginePaused?'CV Engine resumed':'CV Engine paused','success');loadSystem();}
}

async function loadLogs(){
  const d=await api('/api/admin/logs');if(!d||!Array.isArray(d))return;
  const el=$('admin-logs');
  el.innerHTML=d.map(l=>`<div class="log-line ${l.level||'INFO'}"><span class="ts">${l.timestamp||''}</span> <span class="sub">[${l.subsystem||'SYS'}]</span> <span class="msg">${l.message||''}</span></div>`).join('');
}

/* ── Init ── */
document.addEventListener('DOMContentLoaded',()=>{
  loadDisk();loadCategories().then(renderCleanupList);loadSystem();loadLogs();
  setInterval(loadDisk,5000);
  setInterval(loadLogs,3000);
  setInterval(loadSystem,10000);
});
</script>
</body>
</html>
